[package]
name = "ha-cli"
version = "0.1.0"
edition = "2021"
description = "Home Assistant Intent CLI for AI agents"
license = "MIT"

[[bin]]
name = "ha"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"

[dev-dependencies]
tempfile = "3"
